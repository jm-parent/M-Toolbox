name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build MToolbox.slnx -c Release
      # Les tests valident aussi catalogue.json (JSON valide, IDs uniques, schéma supporté).
      - run: dotnet test MToolbox.slnx -c Release --no-build
